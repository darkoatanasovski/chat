# Cloudflare Worker edge router (infra/cloudflare/src/worker.js).
# Deploy with: wrangler deploy   (from this directory)
name = "chat-edge-router"
main = "src/worker.js"
compatibility_date = "2024-09-01"

# Smart Placement: run the Worker next to the Railway origin (single region,
# Amsterdam) instead of at the eyeball PoP, so the Worker->origin subrequests
# ride Cloudflare's backbone rather than a public-internet hop from a distant
# PoP. Targets the ~38-55ms edge->origin overhead measured in the in-region
# probe. Free + reversible; Cloudflare learns optimal placement over some
# traffic, so give it a little time before judging. The real Argo Smart Routing
# equivalent needs a custom domain + paid add-on, layered on later.
[placement]
mode = "smart"

# Placement map: apikey/appid -> {region, shard}. Create it once with
#   wrangler kv namespace create PLACEMENT
# and paste the returned id below. Populated by infra/cloudflare/sync-kv.sh or
# by the scheduled() KV refresh (see [triggers] below).
[[kv_namespaces]]
binding = "PLACEMENT"
id = "a090b7e6d5274539a41b2d01174640a1"

# Edge request metrics: the Worker writes one datapoint per request (plane,
# region, shard, status). Query via the Analytics Engine SQL API.
[[analytics_engine_datasets]]
binding = "EDGE_ANALYTICS"
dataset = "chat_edge_requests"

# Cron Triggers: refresh the placement KV from PLACEMENT_SYNC_URL on a
# schedule (the Worker's scheduled() handler), so KV self-heals even if an
# on-change sync is missed. Every 5 minutes here.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# region id -> that region's origin (the per-region api hostname). The Worker
# proxies data-plane requests to the origin of the app's placement region.
# Pointed at the Railway deployment (the us-east-1 cell's api).
REGIONS = '{"us-east-1":"https://api-production-15fc.up.railway.app"}'
# region -> that region's ws (WebSocket edge) origin. WS upgrades (/connect)
# proxy here instead of the api origin.
WS_REGIONS = '{"us-east-1":"https://ws-production-f5ba.up.railway.app"}'
# The global control-plane service (chat control) — org/dashboard/billing.
CONTROL_ORIGIN = "https://control-production-08ab.up.railway.app"
# Public base URL for R2 attachments. Uploads return "<base>/<key>"; reads are
# served back through this Worker's GET /uploads/<key> route (handleUploadRead)
# so the demo works without a separate CDN domain. Point this at a dedicated R2
# custom domain in production to keep reads off the Worker.
ATTACHMENTS_BASE_URL = "https://chat-edge-router.reedee.workers.dev/uploads"
# JSON placements source for the scheduled KV refresh: returns
# [{"key":"apikey:..","region":"..","shard":".."}, ...]. Point it at a
# control-plane export endpoint (protect with Access), or leave empty to rely
# on sync-kv.sh from CI instead.
PLACEMENT_SYNC_URL = ""

# AUTH_SECRET is a SECRET, not a var — set it so the Worker HMAC-verifies
# bearer tokens at the edge (must equal the platform's AUTH_SECRET):
#   wrangler secret put AUTH_SECRET
# If unset, the Worker reads token claims without verifying and lets the
# origin verify instead.

# ---- Out-of-the-box services to enable as you adopt each piece -----------
# (see infra/cloudflare/cloudflare-services.md)
#
# R2 for message attachments (S3-compatible, no egress) — used by the
# /uploads handler in src/worker.js. Bucket created; binding live.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "chat-attachments"

# Hyperdrive to accelerate the config Postgres from Workers (if a Worker ever
# reads it directly, e.g. a Postgres-backed scheduled sync). Create with:
#   npx wrangler hyperdrive create chat-config --connection-string="postgres://..."
# then paste the id here:
# [[hyperdrive]]
# binding = "CONFIG_DB"
# id = "REPLACE_WITH_HYPERDRIVE_ID"
#
# D1 (serverless SQLite) as an alternative config/placement store — see
# infra/cloudflare/d1/schema.sql. Create with:
#   npx wrangler d1 create chat-config
# [[d1_databases]]
# binding = "CONFIG_D1"
# database_name = "chat-config"
# database_id = "REPLACE_WITH_D1_ID"
#
# Queues as an edge event bus (if realtime moves to Workers/Durable Objects):
# [[queues.producers]]
# binding = "EVENTS"
# queue = "chat-events"
