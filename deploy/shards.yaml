# Virtual-shard -> physical-shard mapping (INSTRUCTIONS.md §8).
#
# hash(channel_id) % virtual_shard_count selects a virtual shard; this file maps
# ranges of virtual shards onto physical Postgres instances. Adding capacity means
# adding a physical_shards entry and moving virtual-shard ranges onto it -- the
# hashing algorithm itself never changes.
#
# The same table drives the user_channels index shard selection, keyed by
# hash(user_id) % virtual_shard_count instead of channel_id.

virtual_shard_count: 4096

physical_shards:
  - id: shard-a
    dsn_env: SHARD_A_DSN
    virtual_shard_range: [0, 2047]
  - id: shard-b
    dsn_env: SHARD_B_DSN
    virtual_shard_range: [2048, 4095]
