version: "3.9"

x-app-build: &app-build
  context: ..
  dockerfile: deploy/docker/Dockerfile

x-common-env: &common-env
  CONTROL_DSN: ${CONTROL_DSN}
  SHARD_A_DSN: ${SHARD_A_DSN}
  SHARD_B_DSN: ${SHARD_B_DSN}
  VALKEY_ADDR: ${VALKEY_ADDR}
  VALKEY_SENTINEL_ADDRS: ${VALKEY_SENTINEL_ADDRS}
  VALKEY_MASTER_NAME: ${VALKEY_MASTER_NAME}
  KAFKA_BROKERS: ${KAFKA_BROKERS}
  AUTH_SECRET: ${AUTH_SECRET}
  APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY}
  SHARDS_CONFIG: /etc/chat/shards.yaml
  TIERS_CONFIG: /etc/chat/tiers.yaml
  PEER_API_EU_URL: http://api-eu:8080
  PEER_API_US_URL: http://api-us:8080
  PEER_API_ASIA_URL: http://api-asia:8080

services:
  postgres-control:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5433:5432"]
    volumes: ["control-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-shard-a:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5434:5432"]
    volumes: ["shard-a-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-shard-b:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5435:5432"]
    volumes: ["shard-b-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT_HOST is a second, host-reachable listener alongside the
      # container-to-container PLAINTEXT one — services inside the compose
      # network (api/gateway/worker) keep using kafka:9092, while anything
      # running directly on the host (go test, ad-hoc debugging) uses
      # localhost:29092. Without it, a host process can dial 9092 for the
      # initial connection but every subsequent produce/consume fails, since
      # the client re-dials whatever address the broker advertises in its
      # metadata response — "kafka", which only resolves inside Docker.
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # message.created is the only topic ever created, so this default
      # applies to it alone: 6 partitions instead of Kafka's default of 1.
      # A single partition caps consumer-group parallelism at one member no
      # matter how many gateway instances exist — there'd be nothing left
      # for a second instance to be assigned. The producer already
      # partitions by channel_id (Balancer: &kafkago.Hash{} in
      # internal/storage/kafka/kafka.go), so per-channel ordering holds
      # regardless of partition count.
      KAFKA_NUM_PARTITIONS: "6"
      CLUSTER_ID: "Q2hhdFBsYXRmb3JtS1JhZnQx"

  # Sentinel-managed primary/replica pair (INSTRUCTIONS.md's Redis-HA
  # follow-up): api/gateway connect through Sentinel
  # (VALKEY_SENTINEL_ADDRS), not directly to "valkey", so a primary failure
  # promotes valkey-replica and every already-connected client's go-redis
  # FailoverClient picks up the new primary on its own — no process
  # restart. "valkey" remains a container/service name, not a guarantee of
  # which physical role currently holds it; ask Sentinel, never assume.
  valkey:
    image: valkey/valkey:7.2-alpine
    ports: ["6379:6379"]

  valkey-replica:
    image: valkey/valkey:7.2-alpine
    command: valkey-server --replicaof valkey 6379
    depends_on: [valkey]

  # Three Sentinels for majority quorum (quorum=2, set in
  # deploy/sentinel/*.conf) — a single Sentinel would itself be a new
  # single point of failure for failover detection, defeating the purpose.
  # Each gets its own config file, not a shared one: Sentinel rewrites its
  # config at runtime to persist state (known replicas, epoch), so three
  # instances sharing one bind-mounted file would corrupt each other's
  # writes.
  valkey-sentinel-1:
    image: valkey/valkey:7.2-alpine
    depends_on: [valkey, valkey-replica]
    command: valkey-sentinel /etc/valkey/sentinel.conf
    volumes: ["../deploy/sentinel/sentinel-1.conf:/etc/valkey/sentinel.conf"]
    ports: ["26379:26379"]

  valkey-sentinel-2:
    image: valkey/valkey:7.2-alpine
    depends_on: [valkey, valkey-replica]
    command: valkey-sentinel /etc/valkey/sentinel.conf
    volumes: ["../deploy/sentinel/sentinel-2.conf:/etc/valkey/sentinel.conf"]
    ports: ["26380:26379"]

  valkey-sentinel-3:
    image: valkey/valkey:7.2-alpine
    depends_on: [valkey, valkey-replica]
    command: valkey-sentinel /etc/valkey/sentinel.conf
    volumes: ["../deploy/sentinel/sentinel-3.conf:/etc/valkey/sentinel.conf"]
    ports: ["26381:26379"]

  api-eu:
    build:
      <<: *app-build
      args:
        SERVICE: api
    depends_on: [postgres-control, postgres-shard-a, postgres-shard-b, valkey, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      REGION: eu
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
    ports: ["8081:8080"]
    volumes:
      - "../deploy/shards.yaml:/etc/chat/shards.yaml:ro"
      - "../deploy/tiers.yaml:/etc/chat/tiers.yaml:ro"

  api-us:
    build:
      <<: *app-build
      args:
        SERVICE: api
    depends_on: [postgres-control, postgres-shard-a, postgres-shard-b, valkey, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      REGION: us
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
    ports: ["8082:8080"]
    volumes:
      - "../deploy/shards.yaml:/etc/chat/shards.yaml:ro"
      - "../deploy/tiers.yaml:/etc/chat/tiers.yaml:ro"

  api-asia:
    build:
      <<: *app-build
      args:
        SERVICE: api
    depends_on: [postgres-control, postgres-shard-a, postgres-shard-b, valkey, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      REGION: asia
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
    ports: ["8083:8080"]
    volumes:
      - "../deploy/shards.yaml:/etc/chat/shards.yaml:ro"
      - "../deploy/tiers.yaml:/etc/chat/tiers.yaml:ro"

  # All four gateway-* services below share one Kafka consumer group
  # (KAFKA_CONSUMER_GROUP: gateway-fanout) instead of one group per region.
  # Kafka splits message.created's 6 partitions across whichever instances
  # are alive, so each message is handled by exactly one of them; that
  # instance delivers to its own local connections directly and routes
  # everyone else through Redis Pub/Sub to whichever instance actually
  # holds them (internal/realtime/fanout.go, pubsub.go). gateway-eu-2 is a
  # second instance in the eu region specifically to exercise that
  # cross-instance path — proof that adding capacity to a region no longer
  # requires a code change, just another instance in the same group.
  gateway-eu:
    build:
      <<: *app-build
      args:
        SERVICE: gateway
    depends_on: [valkey, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      REGION: eu
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
      KAFKA_CONSUMER_GROUP: gateway-fanout
    ports: ["8091:8080"]
    volumes: ["../deploy/shards.yaml:/etc/chat/shards.yaml:ro"]

  gateway-eu-2:
    build:
      <<: *app-build
      args:
        SERVICE: gateway
    depends_on: [valkey, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      REGION: eu
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
      KAFKA_CONSUMER_GROUP: gateway-fanout
    ports: ["8094:8080"]
    volumes: ["../deploy/shards.yaml:/etc/chat/shards.yaml:ro"]

  gateway-us:
    build:
      <<: *app-build
      args:
        SERVICE: gateway
    depends_on: [valkey, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      REGION: us
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
      KAFKA_CONSUMER_GROUP: gateway-fanout
    ports: ["8092:8080"]
    volumes: ["../deploy/shards.yaml:/etc/chat/shards.yaml:ro"]

  gateway-asia:
    build:
      <<: *app-build
      args:
        SERVICE: gateway
    depends_on: [valkey, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      REGION: asia
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
      KAFKA_CONSUMER_GROUP: gateway-fanout
    ports: ["8093:8080"]
    volumes: ["../deploy/shards.yaml:/etc/chat/shards.yaml:ro"]

  worker-outbox-a:
    build:
      <<: *app-build
      args:
        SERVICE: worker
    # postgres-control: the retention sweep (cmd/worker/retention.go) reads
    # organizations/apps/channels to resolve each channel's tier — the one
    # thing this worker touches outside its own shard.
    depends_on: [postgres-control, postgres-shard-a, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      SHARD_ID: shard-a
      SHARD_DSN: ${SHARD_A_DSN}
      METRICS_ADDR: ":9100"
    ports: ["9101:9100"]
    volumes:
      - "../deploy/shards.yaml:/etc/chat/shards.yaml:ro"
      - "../deploy/tiers.yaml:/etc/chat/tiers.yaml:ro"

  worker-outbox-b:
    build:
      <<: *app-build
      args:
        SERVICE: worker
    depends_on: [postgres-control, postgres-shard-b, kafka]
    restart: unless-stopped
    environment:
      <<: *common-env
      SHARD_ID: shard-b
      SHARD_DSN: ${SHARD_B_DSN}
      METRICS_ADDR: ":9100"
    ports: ["9102:9100"]
    volumes:
      - "../deploy/shards.yaml:/etc/chat/shards.yaml:ro"
      - "../deploy/tiers.yaml:/etc/chat/tiers.yaml:ro"

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - "../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus-data:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:11.3.1
    depends_on: [prometheus]
    ports: ["3003:3000"]
    environment:
      # Dev-only convenience — anonymous viewer access, no login screen to
      # get past just to look at a dashboard on a local stack. Same
      # dev-grade posture the rest of this platform is explicit about
      # (docs/platform/security.md); never do this for a real deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DEFAULT_APP_MODE: production
    volumes:
      - "../deploy/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "../deploy/grafana/dashboards:/var/lib/grafana-dashboards:ro"
      - "grafana-data:/var/lib/grafana"

volumes:
  control-data:
  shard-a-data:
  shard-b-data:
  prometheus-data:
  grafana-data:
