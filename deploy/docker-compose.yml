# Local cell-based stack (docs/adr/0006-cell-based-tenant-routing.md).
#
#   router  →  cell us-east-1-a  (its own Postgres + Kafka + Valkey,
#                                 running api / ws / worker)
#   config-postgres              (the one global control-plane DB)
#
# One self-contained cell is enough to exercise the whole model locally: the
# router resolves apikey→cell from the config DB and proxies to the cell's
# api/ws. To add a second cell (or region), copy the `us-east-1-a-*` service
# block under a new id, give it its own Postgres/Kafka/Valkey, add its
# Postgres to deploy/migrate.sh's CELL_DB_SERVICES, and add it to
# infra/topology.yaml. Production runs 2+ api/ws/worker replicas per cell
# (infra/topology.yaml `replicas`); locally one of each keeps the stack light
# (scale any role with `docker compose up --scale us-east-1-a-api=2`).

x-app-build: &app-build
  context: ..
  # Defaults to the multi-stage build (compiles Go in Docker). `make up-prebuilt`
  # sets CHAT_DOCKERFILE=deploy/docker/Dockerfile.prebuilt to use a host-built
  # binary instead, avoiding an in-container `go build` that can OOM Docker.
  dockerfile: ${CHAT_DOCKERFILE:-deploy/docker/Dockerfile}

# Shared env for every role running inside cell us-east-1-a.
x-cell-env: &cell-env
  CONFIG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@config-postgres:5432/${POSTGRES_DB}?sslmode=disable
  CELL_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@us-east-1-a-postgres:5432/${POSTGRES_DB}?sslmode=disable
  VALKEY_ADDR: us-east-1-a-valkey:6379
  KAFKA_BROKERS: us-east-1-a-kafka:9092
  AUTH_SECRET: ${AUTH_SECRET}
  APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY}
  TIERS_CONFIG: /etc/chat/tiers.yaml
  TOPOLOGY_CONFIG: /etc/chat/topology.yaml
  REGION: us-east-1
  SHARD_ID: us-east-1-a
  OG_SERVICE_URL: http://og-service:8080
  AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY}
  AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION}

services:
  # ---- global control plane ------------------------------------------------
  config-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5433:5432"]
    volumes: ["config-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- edge router ---------------------------------------------------------
  router:
    build: *app-build
    command: ["router"]
    depends_on: [config-postgres, control, us-east-1-a-api, us-east-1-a-ws]
    restart: unless-stopped
    environment:
      CONFIG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@config-postgres:5432/${POSTGRES_DB}?sslmode=disable
      VALKEY_ADDR: us-east-1-a-valkey:6379
      AUTH_SECRET: ${AUTH_SECRET}
      TOPOLOGY_CONFIG: /etc/chat/topology.yaml
      # Control-plane paths (/organizations, /apps, /dashboard, /dodo) are
      # proxied here; everything else routes to a cell by apikey.
      CONTROL_URL: http://control:8080
      ROUTER_ADDR: ":8080"
      METRICS_ADDR: ":9100"
    ports: ["8080:8080"] # the global endpoint (api.chat.io) in production

  # ---- global control plane (org/dashboard/billing) -----------------------
  control:
    build: *app-build
    command: ["control"]
    depends_on: [config-postgres, us-east-1-a-postgres, us-east-1-a-valkey]
    restart: unless-stopped
    environment:
      CONFIG_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@config-postgres:5432/${POSTGRES_DB}?sslmode=disable
      # Per-cell DSNs, named by infra/topology.yaml's postgres.dsn_env. The
      # control plane connects every cell for dashboard admin reads/writes.
      SHARD_US_EAST_1_A_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@us-east-1-a-postgres:5432/${POSTGRES_DB}?sslmode=disable
      VALKEY_ADDR: us-east-1-a-valkey:6379
      AUTH_SECRET: ${AUTH_SECRET}
      APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY}
      TIERS_CONFIG: /etc/chat/tiers.yaml
      TOPOLOGY_CONFIG: /etc/chat/topology.yaml
      OG_SERVICE_URL: http://og-service:8080
      AZURE_TRANSLATOR_KEY: ${AZURE_TRANSLATOR_KEY}
      AZURE_TRANSLATOR_REGION: ${AZURE_TRANSLATOR_REGION}
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
    ports: ["8082:8080"] # direct control-plane access; normally via the router

  # ---- cell us-east-1-a: infrastructure -----------------------------------
  us-east-1-a-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5434:5432"]
    volumes: ["us-east-1-a-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  us-east-1-a-valkey:
    image: valkey/valkey:7.2-alpine
    ports: ["6379:6379"]

  us-east-1-a-kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://us-east-1-a-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@us-east-1-a-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "6"
      CLUSTER_ID: "Q2hhdFBsYXRmb3JtS1JhZnQx"

  # ---- cell us-east-1-a: roles (chat api / ws / worker) -------------------
  us-east-1-a-api:
    build: *app-build
    command: ["api"]
    depends_on: [config-postgres, us-east-1-a-postgres, us-east-1-a-valkey, us-east-1-a-kafka, og-service]
    restart: unless-stopped
    environment:
      <<: *cell-env
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
    ports: ["8081:8080"] # direct cell access; normally reached via the router

  us-east-1-a-ws:
    build: *app-build
    command: ["ws"]
    depends_on: [config-postgres, us-east-1-a-postgres, us-east-1-a-valkey, us-east-1-a-kafka]
    restart: unless-stopped
    environment:
      <<: *cell-env
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
      KAFKA_CONSUMER_GROUP: ws-us-east-1-a
    ports: ["8091:8080"]

  us-east-1-a-worker:
    build: *app-build
    command: ["worker"]
    depends_on: [config-postgres, us-east-1-a-postgres, us-east-1-a-kafka]
    restart: unless-stopped
    environment:
      <<: *cell-env
      METRICS_ADDR: ":9100"
    ports: ["9101:9100"]

  # Per-cell metrics collector: scrapes this cell's api/ws/worker every 5s,
  # stamps region+shard, and remote-writes to the central Prometheus. One per
  # cell — copy alongside each cell's role services.
  us-east-1-a-alloy:
    image: grafana/alloy:v1.5.1
    depends_on: [us-east-1-a-api, us-east-1-a-ws, us-east-1-a-worker, prometheus]
    restart: unless-stopped
    environment:
      REGION: us-east-1
      SHARD: us-east-1-a
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - "../deploy/observability/alloy/cell.alloy:/etc/alloy/config.alloy:ro"

  # ---- shared standalone services -----------------------------------------
  og-service:
    build: *app-build
    command: ["og"]
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9100"
    ports: ["8095:8080"]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - "../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus-data:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      # Cells push their metrics here (deploy/observability/alloy/cell.alloy).
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:11.3.1
    depends_on: [prometheus]
    ports: ["3003:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DEFAULT_APP_MODE: production
    volumes:
      - "../deploy/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "../deploy/grafana/dashboards:/var/lib/grafana-dashboards:ro"
      - "grafana-data:/var/lib/grafana"

volumes:
  config-data:
  us-east-1-a-data:
  prometheus-data:
  grafana-data:
