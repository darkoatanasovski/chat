# Scrapes every service's /metrics endpoint over the compose network by
# service name — none of these ports need to be exposed to the host for
# this to work, Prometheus runs inside the same network (see
# docker-compose.yml). Each target gets an explicit `region` label since
# that's not otherwise derivable from the Prometheus namespace alone (all
# three api-* instances share the same metric names, chat_api_*).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api-eu:9100"]
        labels: { region: eu }
      - targets: ["api-us:9100"]
        labels: { region: us }
      - targets: ["api-asia:9100"]
        labels: { region: asia }

  - job_name: gateway
    static_configs:
      - targets: ["gateway-eu:9100"]
        labels: { region: eu, instance_name: gateway-eu }
      - targets: ["gateway-eu-2:9100"]
        labels: { region: eu, instance_name: gateway-eu-2 }
      - targets: ["gateway-us:9100"]
        labels: { region: us, instance_name: gateway-us }
      - targets: ["gateway-asia:9100"]
        labels: { region: asia, instance_name: gateway-asia }

  - job_name: worker
    static_configs:
      - targets: ["worker-outbox-a:9100"]
        labels: { shard: shard-a }
      - targets: ["worker-outbox-b:9100"]
        labels: { shard: shard-b }

  - job_name: og-service
    static_configs:
      - targets: ["og-service:9100"]
