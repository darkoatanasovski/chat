# Central Prometheus for the whole fleet (all regions and cells), fronting one
# Grafana. In the cell model, cells PUSH their metrics here via remote-write
# (each cell runs a Grafana Alloy collector — deploy/observability/alloy/cell.alloy
# — enabled by --web.enable-remote-write-receiver in docker-compose.yml), so
# this config no longer lists cell services as scrape targets. It only directly
# scrapes the GLOBAL services co-located with it (router, control, og-service)
# and itself.
#
# A production fleet would point remote-write at Grafana Mimir / Thanos / Grafana
# Cloud instead of a single Prometheus, for horizontal storage and long
# retention; the collector config doesn't change — only the remote_write URL.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: router
    static_configs:
      - targets: ["router:9100"]

  - job_name: control
    static_configs:
      - targets: ["control:9100"]

  - job_name: og-service
    static_configs:
      - targets: ["og-service:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
